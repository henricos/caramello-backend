[project]
name = "caramello-api"
version = "2.0.0"
description = "Caramello API — hybrid REST + MCP backend with OIDC authentication and Postgres."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
# Pinning policy (docs/monorepo.md): `~=X.Y.Z` locks major.minor and lets
# only the patch level float — security fixes come in, breaking releases
# don't. Minor/major upgrades are deliberate, reviewed changes.
dependencies = [
    "alembic~=1.16.5",
    "asyncpg~=0.31.0",
    "email-validator~=2.3.0",
    "fastapi~=0.118.0",
    "fastapi-mcp~=0.4.0",
    "httpx~=0.28.1",
    "ofxparse~=0.21",
    "openpyxl~=3.1.5",
    "pydantic~=2.11.10",
    "pydantic-settings~=2.12.0",
    "pyjwt[crypto]~=2.13.0",
    "rapidfuzz~=3.14.5",
    "sqlalchemy[asyncio]~=2.0.43",
    "sqlmodel~=0.0.38",
    "uvicorn[standard]~=0.37.0",
]

[dependency-groups]
# pyyaml is a tooling dependency: only scripts/ (the DSL generator) reads YAML,
# never the application at runtime — which is why the image builds --no-dev.
dev = [
    "mypy~=2.1.0",
    # Embedded Postgres for local development: `shared/db_dev_server.py` boots
    # it, so no PostgreSQL installation is required on the developer's machine.
    "pgembed~=0.2.0",
    "pytest~=9.0.1",
    "pytest-asyncio~=1.4.0",
    "pyyaml~=6.0.3",
    "ruff~=0.15.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real database — skipped without caramello_dev",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
# Applied migrations are immutable historical records: they describe a schema
# change that already ran against a real database, so reformatting them buys
# nothing and destroys the guarantee that the file on disk is the file that
# ran. Only the revision scripts are excluded — migrations/env.py is live code
# and stays formatted with the rest of the module.
exclude = ["src/caramello_api/migrations/versions"]

[tool.ruff.lint]
# A deliberate superset of ruff's defaults: the template does not select rules
# explicitly, and adding these is additive quality, not a divergence.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the documented pattern

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = false
warn_unused_ignores = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caramello_api"]
