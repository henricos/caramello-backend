# dsl/operations/finances.yaml
# Business operations of the finances domain.
# Generates src/caramello_api/finances/operations.py (stub: # CARAMELLO-GENERATED: stub).
# RULE: never add an endpoint to operations.py without declaring it here first.
# Mandatory flow: declare in this YAML -> generate the stub (bin/generate_code) -> implement it.

domain: finances
operations:
  # --- Accounts ---
  - name: create_account
    method: POST
    path: /finances/accounts
    description: "Creates a bank/card/savings account for the authenticated family."

  - name: list_accounts
    method: GET
    path: /finances/accounts
    description: "Lists the accounts of the authenticated family."

  - name: get_account
    method: GET
    path: /finances/accounts/{account_uuid}
    description: "Returns an account's details by public UUID."

  - name: update_account
    method: PATCH
    path: /finances/accounts/{account_uuid}
    description: "Updates the name or type of an account, or archives it (is_active=false)."

  # --- Categories ---
  - name: create_category
    method: POST
    path: /finances/categories
    description: "Creates a parent category (level 1) scoped to a family."

  - name: list_categories
    method: GET
    path: /finances/categories
    description: "Lists the categories of the authenticated family."

  - name: get_category
    method: GET
    path: /finances/categories/{category_uuid}
    description: "Returns a category's details by public UUID."

  - name: update_category
    method: PATCH
    path: /finances/categories/{category_uuid}
    description: "Updates the name of a category."

  # --- Subcategories ---
  - name: create_subcategory
    method: POST
    path: /finances/subcategory
    description: "Creates a subcategory (level 2) attached to a parent category."

  - name: list_subcategories
    method: GET
    path: /finances/subcategory
    description: "Lists the family's subcategories, optionally filtered by category_uuid."

  - name: get_subcategory
    method: GET
    path: /finances/subcategory/{subcategory_uuid}
    description: "Returns a subcategory's details by public UUID."

  - name: update_subcategory
    method: PATCH
    path: /finances/subcategory/{subcategory_uuid}
    description: "Updates the name of a subcategory."

  # --- Movements ---
  - name: create_movement
    method: POST
    path: /finances/accounts/{account_uuid}/movements
    description: "Records a single movement (credit/debit) in an account."

  - name: list_movements
    method: GET
    path: /finances/accounts/{account_uuid}/movements
    description: "Lists an account's movements with pagination and filters."

  - name: import_movements_endpoint
    method: POST
    path: /finances/accounts/{account_uuid}/movements/import
    description: "Imports movements in bulk from CSV/OFX/XLSX, deduplicating automatically."

  - name: confirm_import
    method: POST
    path: /finances/import/confirm
    description: "Confirms a pending movement import after review."

  # --- Reconciliation ---
  - name: get_suggest_category
    method: GET
    path: /finances/movements/{movement_uuid}/suggest-category
    description: "Returns the top-5 subcategory suggestions by fuzzy match on the description."

  - name: reconcile_movement
    method: POST
    path: /finances/movements/{movement_uuid}/reconcile
    description: "Reconciles a movement against a subcategory, creating a financial entry."

  # --- Financial entries ---
  - name: get_entry
    method: GET
    path: /finances/entries/{entry_uuid}
    description: "Returns a financial entry's details by public UUID."

  - name: update_entry
    method: PATCH
    path: /finances/entries/{entry_uuid}
    description: "Updates the accrual period (competencia) or subcategory of an existing entry."

  - name: list_entries
    method: GET
    path: /finances/entries
    description: "Lists entries filtered by family, account, accrual period and subcategory."

  # --- Balances ---
  - name: get_account_balance
    method: GET
    path: /finances/accounts/{account_uuid}/balance
    description: "Returns an account's current balance, derived from its movements."

  - name: get_family_balance
    method: GET
    path: /finances/families/{family_uuid}/balance
    description: "Returns the consolidated balance of every account of the family."

  # --- Reports ---
  - name: get_monthly_report
    method: GET
    path: /finances/reports/monthly
    description: "Monthly breakdown of entries by parent category and subcategory."

  - name: get_by_member_report
    method: GET
    path: /finances/reports/by-member
    description: "Breakdown of entries grouped by the responsible family member."
