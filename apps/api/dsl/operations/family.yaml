# dsl/operations/family.yaml
# Business operations of the families domain.
# Generates src/caramello_api/families/operations.py (a stub, then implemented).

domain: families
operations:
  - name: registry_family
    method: POST
    path: /families/registry
    description: "Creates a family and registers the authenticated user as its owner (role='owner')."

  - name: list_my_families
    method: GET
    path: /families/families
    description: "Lists the families the authenticated user belongs to."

  - name: get_family_detail
    method: GET
    path: /families/families/{family_uuid}
    description: "Returns a family's details when the user is a member; 403 otherwise."

  - name: pre_register_member
    method: POST
    path: /families/families/{family_uuid}/pre-register
    description: "The owner pre-registers an e-mail for automatic joining. A non-owner gets 403."

  - name: list_members
    method: GET
    path: /families/families/{family_uuid}/members
    description: "Lists the members of the family (any member may read it)."

  - name: remove_member
    method: DELETE
    path: /families/families/{family_uuid}/members/{user_uuid}
    description: "Removes a member from the family (owner only). A non-owner gets 403."
