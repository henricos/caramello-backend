# dsl/entities/movement.yaml
# Raw financial movement imported from the bank.
# Domain: finances

name: Movement
domain: finances
description: "Raw financial movement imported from a bank statement."
table_name: movement

# No generic CRUD router — see dsl/entities/account.yaml.
generate_router: false

fields:
  - name: id
    type: int
    primary_key: true
    description: "Internal primary key (numeric)."

  - name: uuid
    type: UUID
    unique: true
    default_factory: uuid4
    nullable: false
    description: "Unique public identifier (UUID)."

  - name: account_id
    type: int
    foreign_key: "account.id"
    nullable: false
    description: "FK to the bank account the movement came from."

  - name: date
    type: datetime
    nullable: false
    description: "Date/time of the movement as stated by the bank."

  - name: amount
    type: Decimal
    nullable: false
    description: "Signed amount: positive=credit, negative=debit. NUMERIC(15,2)."

  - name: description
    type: str
    max_length: 255
    nullable: false
    description: "Description of the movement as stated by the bank."

  - name: import_hash
    type: str
    unique: true
    nullable: true
    description: "SHA-256 hash of the imported record, for deduplication. Null for a manual entry."

  - name: created_at
    type: datetime
    default_factory: now_utc
    nullable: false
    description: "Timestamp of the record's creation."

  - name: updated_at
    type: datetime
    default_factory: now_utc
    nullable: false
    description: "Timestamp of the record's last update."

filters:
  - fields: [account_id]
