# dsl/entities/family_invitation.yaml
# Definition of the FamilyInvitation entity.
# Redesigned from "e-mail invitation with expiry" to
# "member pre-registration".

name: FamilyInvitation
domain: families
description: "Pre-registration of a family member by e-mail."
table_name: family_invitation

# The generic CRUD router is not emitted for this entity: an invitation is
# created exclusively by the owner, through the business operation
# POST /families/families/{family_uuid}/pre-register, which is where the
# ownership check lives. A public CRUD would also have to accept a family
# reference from the caller, and the only safe public reference is a UUID, which
# a generated route cannot resolve back to the integer FK the table stores.
generate_router: false

fields:
  - name: id
    type: int
    primary_key: true
    description: "Internal primary key (numeric)."

  - name: uuid
    type: UUID
    unique: true
    default_factory: uuid4
    nullable: false
    description: "Unique public identifier (UUID)."

  - name: family_id
    type: int
    foreign_key: "family.id"
    nullable: false
    # FamilyInvitationRead is returned by the pre-register operation, so this FK
    # is part of a PUBLIC response and must be a UUID there (table keeps the int).
    expose_as_uuid: true
    description: "Family the invitation belongs to. Public schemas: family_uuid."

  - name: inviter_id
    type: int
    foreign_key: "user.id"
    nullable: false
    # Points at `user`: always exposed as a UUID (see docs/dsl-rules.md).
    expose_as_uuid: true
    description: "User who sent the invitation. Public schemas: inviter_uuid."

  - name: email
    type: str
    nullable: false
    description: "E-mail matched automatically at login (pre-registration)."

  - name: status
    type: str
    max_length: 20
    default: "pending_login"
    nullable: false
    description: "Pre-registration status: pending_login or joined."

  - name: created_at
    type: datetime
    default_factory: now_utc
    nullable: false
    description: "Timestamp of the invitation's creation."

relationships:
  - name: family
    type: "Family"
    back_populates: "invitations"

  - name: inviter
    type: "User"
    back_populates: "sent_invitations"
