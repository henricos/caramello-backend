# dsl/entities/financial_entry.yaml
# Classified financial entry — inherits amount/type from Movement (D-05).
# Domain: finances (Phase 6, Plan 02)

name: FinancialEntry
domain: finances
description: "Classified financial entry. Inherits amount and type from Movement (1:1 relation, D-05)."
table_name: financial_entry

# No generic CRUD router — see dsl/entities/account.yaml.
generate_router: false

fields:
  - name: id
    type: int
    primary_key: true
    description: "Internal primary key (numeric)."

  - name: uuid
    type: UUID
    unique: true
    default_factory: uuid4
    nullable: false
    description: "Unique public identifier (UUID)."

  - name: movement_id
    type: int
    foreign_key: "movement.id"
    unique: true
    nullable: false
    description: "FK to Movement (1:1 relation — a movement has at most one entry). D-05."

  - name: subcategory_id
    type: int
    foreign_key: "subcategory.id"
    nullable: false
    description: "FK to the subcategory classifying the entry (D-08)."

  - name: competencia_year
    type: int
    nullable: false
    description: "Accrual year (competencia) of the entry (e.g. 2024). D-04."

  - name: competencia_month
    type: int
    nullable: false
    description: "Accrual month (competencia) of the entry (1-12). D-04."

  - name: notes
    type: str
    max_length: 500
    nullable: true
    description: "Additional notes about the entry (optional)."

  - name: is_recorrente
    type: bool
    default: false
    nullable: false
    description: "Whether the entry is recurring (LAN-04)."

  - name: responsible_user_id
    type: int
    foreign_key: "user.id"
    nullable: true
    expose_as_uuid: true
    description: "Nullable FK to User — who is responsible for the entry (D-SCHEMA-01/02, D-ATTR-03). Exposed as responsible_user_uuid (UUID) in the public schemas."

  - name: created_at
    type: datetime
    default_factory: now_utc
    nullable: false
    description: "Timestamp of the record's creation."

  - name: updated_at
    type: datetime
    default_factory: now_utc
    nullable: false
    description: "Timestamp of the record's last update."

filters:
  - fields: [competencia_year, competencia_month]
  - fields: [subcategory_id]
