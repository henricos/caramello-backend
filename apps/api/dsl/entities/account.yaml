# dsl/entities/account.yaml
# Bank account, card, savings or investment account of a family member.
# Domain: finances (Phase 6, Plan 02)

name: Account
domain: finances
description: "Bank account, card, savings or investment account of a family member."
table_name: account

# No generic CRUD router: the whole public surface of `finances` is hand-written
# in `finances/operations.py`, where every route resolves a public UUID to the
# internal id and checks family membership first.
generate_router: false

fields:
  - name: id
    type: int
    primary_key: true
    description: "Internal primary key (numeric)."

  - name: uuid
    type: UUID
    unique: true
    default_factory: uuid4
    nullable: false
    description: "Unique public identifier (UUID)."

  - name: family_id
    type: int
    foreign_key: "family.id"
    nullable: false
    description: "FK to the family that owns the account."

  - name: name
    type: str
    max_length: 100
    nullable: false
    description: "Descriptive name of the account (e.g. Nubank PF, Caixa Poupança)."

  - name: type
    type: str
    max_length: 20
    nullable: false
    description: "Type: corrente, poupanca, cartao, investimento."

  - name: currency
    type: str
    max_length: 3
    default: "BRL"
    nullable: false
    description: "ISO 4217 currency code (e.g. BRL, USD)."

  - name: is_active
    type: bool
    default: true
    nullable: false
    description: "Account is active (false = archived)."

  - name: created_at
    type: datetime
    default_factory: now_utc
    nullable: false
    description: "Timestamp of the record's creation."

  - name: updated_at
    type: datetime
    default_factory: now_utc
    nullable: false
    description: "Timestamp of the record's last update."

filters:
  - fields: [family_id]
