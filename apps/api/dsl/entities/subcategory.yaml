# dsl/entities/subcategory.yaml
# Financial classification subcategory (level 2 of the hierarchy).
# Domain: finances
# Two-level hierarchy: Category -> Subcategory.
# No field pointing at another Subcategory — the two-level limit is
# enforced by the schema, not by business logic.

name: Subcategory
domain: finances
description: "Financial classification subcategory — level 2 of the hierarchy. Parent: Category."
table_name: subcategory

# No generic CRUD router — see dsl/entities/account.yaml.
generate_router: false

fields:
  - name: id
    type: int
    primary_key: true
    description: "Internal primary key (numeric)."

  - name: uuid
    type: UUID
    unique: true
    default_factory: uuid4
    nullable: false
    description: "Unique public identifier (UUID)."

  - name: category_id
    type: int
    foreign_key: "category.id"
    nullable: false
    description: "FK to the parent category (level 1) of the two-level hierarchy."

  - name: name
    type: str
    max_length: 100
    nullable: false
    description: "Name of the subcategory (e.g. Restaurante, Combustível)."

  - name: created_at
    type: datetime
    default_factory: now_utc
    nullable: false
    description: "Timestamp of the record's creation."

  - name: updated_at
    type: datetime
    default_factory: now_utc
    nullable: false
    description: "Timestamp of the record's last update."

filters:
  - fields: [category_id]
