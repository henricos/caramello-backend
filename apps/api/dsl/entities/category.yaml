# dsl/entities/category.yaml
# Financial classification category (level 1 of the hierarchy).
# Domain: finances
# Note: the two-level hierarchy uses a separate Subcategory entity.
# No self-reference.

name: Category
domain: finances
description: "Financial classification category — level 1 of the hierarchy. Child: Subcategory."
table_name: category

# No generic CRUD router — see dsl/entities/account.yaml.
generate_router: false

fields:
  - name: id
    type: int
    primary_key: true
    description: "Internal primary key (numeric)."

  - name: uuid
    type: UUID
    unique: true
    default_factory: uuid4
    nullable: false
    description: "Unique public identifier (UUID)."

  - name: family_id
    type: int
    foreign_key: "family.id"
    nullable: false
    description: "FK to the family that owns the category."

  - name: name
    type: str
    max_length: 100
    nullable: false
    description: "Name of the category (e.g. Alimentação, Transporte)."

  - name: created_at
    type: datetime
    default_factory: now_utc
    nullable: false
    description: "Timestamp of the record's creation."

  - name: updated_at
    type: datetime
    default_factory: now_utc
    nullable: false
    description: "Timestamp of the record's last update."

filters:
  - fields: [family_id]
