# dsl/entities/family_invitation.yaml
# Definition of the FamilyInvitation entity.
# Redesenhada na Phase 4 (D-01): de "convite por email com expiração" para "pré-registro de membro".

name: FamilyInvitation
domain: families
description: "Pré-registro de membro de família por email (D-01)."
table_name: family_invitation

fields:
  - name: id
    type: int
    primary_key: true
    description: "Internal primary key (numeric)."

  - name: uuid
    type: UUID
    unique: true
    default_factory: uuid4
    nullable: false
    description: "Unique public identifier (UUID)."

  - name: family_id
    type: int
    foreign_key: "family.id"
    nullable: false
    description: "ID of the family to which the invitation was sent."

  - name: inviter_id
    type: int
    foreign_key: "user.id"
    nullable: false
    description: "ID of the user who sent the invitation."

  - name: email
    type: str
    nullable: false
    description: "Email para matching automático no login (pré-registro D-01)."

  - name: status
    type: str
    max_length: 20
    default: "pending_login"
    nullable: false
    description: "Status do pré-registro: pending_login ou joined (D-01)."

  - name: created_at
    type: datetime
    default_factory: now_utc
    nullable: false
    description: "Timestamp of the invitation's creation."

relationships:
  - name: family
    type: "Family"
    back_populates: "invitations"

  - name: inviter
    type: "User"
    back_populates: "sent_invitations"
