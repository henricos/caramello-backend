# dsl/entities/user.yaml
# Definition of the User entity, aligned with Keycloak authentication.

name: User
domain: users
description: Represents a system user, provisioned on first authentication via Keycloak.
table_name: user

fields:
  - name: id
    type: int
    primary_key: true
    description: "Internal primary key (numeric)."

  - name: uuid
    type: UUID
    unique: true
    default_factory: uuid4
    nullable: false
    description: "Unique public identifier (UUID)."

  - name: idp_sub
    type: str
    unique: true
    nullable: false
    description: "Subject claim from Keycloak JWT (sub). Used for JIT provisioning."

  - name: email
    type: EmailStr
    unique: true
    nullable: false
    description: "Endereço de e-mail único do usuário."

  - name: name
    type: str
    max_length: 100
    nullable: false
    description: "User's full name."

  - name: created_at
    type: datetime
    default_factory: now_utc
    nullable: false
    description: "Timestamp of the record's creation."

  - name: updated_at
    type: datetime
    default_factory: now_utc
    on_update: now_utc
    nullable: false
    description: "Timestamp of the record's last update."

relationships:
  - name: families
    type: "list[Family]"
    link_model: "FamilyMember"
    back_populates: "members"
    overlaps: "user,family"
    description: "Families to which the user belongs."

  - name: sent_invitations
    type: "list[FamilyInvitation]"
    relationship_type: "OneToMany"
    back_populates: "inviter"
    foreign_key: "FamilyInvitation.inviter_id"
    description: "Invitations sent by this user."
