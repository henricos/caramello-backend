[project]
name = "caramello-api"
version = "0.1.0"
description = "API de backend para a aplicação Caramello"
authors = [{ name = "Henrico", email = "henrico@example.com" }]
dependencies = [
    "fastapi",
    "sqlmodel>=0.0.38",
    "alembic",
    "pydantic",
    "uvicorn",
    "pyyaml",
    "email-validator>=2.3.0",
    "pydantic-settings",
    "asyncpg>=0.31.0",
    "pyjwt[crypto]>=2.13.0",
    "httpx>=0.28.1",
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "datamodel-code-generator",
]

[tool.uv]
# Configurações específicas do uv, se houver

[tool.alembic]
# Configurações do Alembic, serão preenchidas posteriormente

packages = [{ include = "caramello", from = "src" }]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.9.0",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: testes que requerem banco real e Keycloak — não rodam em CI padrão",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]
exclude = [
    "src/caramello/api/generated",
    "src/caramello/models",
    "src/caramello/schemas/generated",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() em argumentos de função é padrão

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = false
warn_unused_ignores = true
exclude = [
    "src/caramello/api/generated/.*",
    "src/caramello/models/.*",
    "src/caramello/schemas/generated/.*",
]
