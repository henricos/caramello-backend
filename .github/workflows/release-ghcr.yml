name: Release GHCR

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Versions are paired across modules (see "Paired versions" in
  # docs/architecture.md): a single vX.Y.Z release publishes EVERY module's
  # image, so the shared guards run once here and every manifest is asserted
  # against the tag before anything is built.
  #
  # TEMPORARY DEVIATION — `apps/web` does not exist in this repository yet, so
  # only apps/api/pyproject.toml is asserted below and there is no
  # `publish-web` job. The pairing structure is already in place: WHEN
  # `apps/web` LANDS, add (a) an "Assert package.json matches release tag"
  # step to this job, mirroring the pyproject assertion, and (b) a
  # `publish-web` job mirroring `publish-api` with `context: ./apps/web` and
  # `scope=web`. Until both exist, the paired-version invariant is only
  # half-enforced.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
      owner: ${{ steps.meta.outputs.owner }}
      stable: ${{ steps.meta.outputs.stable }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert release commit belongs to main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          # GHCR image names must be lowercase; repository_owner may not be.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          # `latest` must always point to the newest STABLE release: a
          # published pre-release (e.g. v2.1.0-rc1) ships only its own tag.
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert pyproject.toml matches release tag
        shell: bash
        run: |
          RELEASE_VERSION="${{ steps.meta.outputs.release_version }}"
          PACKAGE_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('apps/api/pyproject.toml','rb'))['project']['version'])")"
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "pyproject.toml version ($PACKAGE_VERSION) does not match release tag version ($RELEASE_VERSION)" >&2
            exit 1
          fi

      # ADD HERE when apps/web lands (see the note at the top of this job):
      # - name: Assert package.json matches release tag
      #   shell: bash
      #   run: |
      #     RELEASE_VERSION="${{ steps.meta.outputs.release_version }}"
      #     PACKAGE_VERSION="$(node -p "require('./apps/web/package.json').version")"
      #     if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
      #       echo "package.json version ($PACKAGE_VERSION) does not match release tag version ($RELEASE_VERSION)" >&2
      #       exit 1
      #     fi

  publish-api:
    runs-on: ubuntu-latest
    needs: prepare
    env:
      IMAGE_NAME: ghcr.io/${{ needs.prepare.outputs.owner }}/caramello-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive image tags
        shell: bash
        run: |
          IMAGE_TAGS="${IMAGE_NAME}:${{ needs.prepare.outputs.release_tag }}"
          if [ "${{ needs.prepare.outputs.stable }}" = "true" ]; then
            IMAGE_TAGS="${IMAGE_TAGS},${IMAGE_NAME}:latest"
          fi
          echo "IMAGE_TAGS=${IMAGE_TAGS}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.release_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # ADD HERE when apps/web lands: a `publish-web` job mirroring `publish-api`
  # (context ./apps/web, GHA cache scope=web, image caramello-web), so that a
  # single vX.Y.Z release publishes both images as the paired-version decision
  # in docs/architecture.md requires.
